name: Go

on:
  push:
    branches: [main]

  pull_request:
    branches: [main]


permissions:
  contents: read

jobs:
  build:
    uses: trancecode/github-workflows/.github/workflows/go-build-test.yml@main
    with:
      system-packages: 'libc6-dev libgl1-mesa-dev libxcursor-dev libxi-dev libxinerama-dev libxrandr-dev libxxf86vm-dev libasound2-dev pkg-config xorg-dev xvfb'
      test-command: 'xvfb-run -a go test -v ./...'
      post-test-command: './scripts/check-headless-packages.sh'
      ignore-paths: '*.md LICENSE docs/**'
