name: Code Analysis

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - 'doc/**'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - 'doc/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analysis:
    uses: trancecode/github-workflows/.github/workflows/go-analysis.yml@main
    with:
      system-packages: 'libc6-dev libgl1-mesa-dev libxcursor-dev libxi-dev libxinerama-dev libxrandr-dev libxxf86vm-dev libasound2-dev pkg-config xorg-dev'
      golangci-args: '--disable=staticcheck'
      staticcheck-checks: 'inherit'
