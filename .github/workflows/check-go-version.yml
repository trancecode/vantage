name: Check Go Version

on:
  schedule:
    # Run every Monday at 9 AM UTC
    - cron: '0 9 * * 1'
  workflow_dispatch:  # Allow manual triggering

permissions:
  contents: read
  issues: write

jobs:
  check-version:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Get current Go version from go.mod
      id: current
      run: |
        # go.mod is the canonical and only source of truth for the repository's
        # Go version. Workflows derive their version from it via
        # `go-version-file: go.mod`, so there is nothing else to update.
        CURRENT_VERSION=$(grep -E '^go [0-9]' go.mod | awk '{print $2}')
        echo "Current Go version in go.mod: $CURRENT_VERSION"
        echo "version=$CURRENT_VERSION" >> "$GITHUB_OUTPUT"

    - name: Get latest stable Go version
      id: latest
      run: |
        # Fetch the latest stable Go version from the official releases page.
        LATEST_VERSION=$(curl -s https://go.dev/VERSION?m=text | head -n 1 | sed 's/go//')
        echo "Latest stable Go version: $LATEST_VERSION"
        echo "version=$LATEST_VERSION" >> "$GITHUB_OUTPUT"

    - name: Open an issue if outdated
      env:
        GH_TOKEN: ${{ github.token }}
        CURRENT_VERSION: ${{ steps.current.outputs.version }}
        LATEST_VERSION: ${{ steps.latest.outputs.version }}
      run: |
        echo "Current: $CURRENT_VERSION"
        echo "Latest: $LATEST_VERSION"

        if [ "$CURRENT_VERSION" = "$LATEST_VERSION" ]; then
          echo "Go version is up to date!"
          exit 0
        fi

        echo "Go version is outdated."
        TITLE="Bump Go version from $CURRENT_VERSION to $LATEST_VERSION"

        # Skip if an open issue for this exact bump already exists. The title is
        # deterministic per target version, so matching on it is enough.
        EXISTING_ISSUE=$(gh issue list --state open --search "$TITLE in:title" \
          --json number,title --jq ".[] | select(.title == \"$TITLE\") | .number" | head -n 1)
        if [ -n "$EXISTING_ISSUE" ]; then
          echo "Issue #$EXISTING_ISSUE already open for this bump, skipping."
          exit 0
        fi

        # Open an issue with the `claude` label rather than crafting the PR here.
        # The autonomous Claude agent picks up `claude`-labelled issues and opens
        # the PR itself, which keeps this workflow free of git plumbing.
        gh issue create \
          --title "$TITLE" \
          --label "claude" \
          --body "$(cat <<EOF
        A new stable Go version is available. Bump the canonical Go version in
        \`go.mod\` from \`$CURRENT_VERSION\` to \`$LATEST_VERSION\`.

        \`go.mod\` is the only place a Go version lives in this repository.
        Update the \`go\` directive (and the \`toolchain\` line, if present); no
        workflow files need to change because they read the version from
        \`go.mod\` via \`go-version-file: go.mod\`.

        See the [Go release notes](https://go.dev/doc/devel/release) for details
        about this version.

        ---
        ✨ Content generated by automated workflow.
        EOF
        )"
