# https://taskfile.dev
version: '3'

vars:
  GOFLAGS: -buildvcs=false

tasks:
  default:
    desc: Show available tasks
    cmds:
      - task --list

  deps:
    desc: Download and verify dependencies
    cmds:
      - go mod download
      - go mod verify

  build:
    desc: Build all packages
    cmds:
      - GOFLAGS="{{.GOFLAGS}}" go build -v ./...

  fmt:check:
    desc: Fail if any file is not gofmt-clean
    summary: |
      Lists the files gofmt would rewrite and fails when there are any. This is
      the first gate the Code Analysis workflow runs, so a formatting slip stops
      the local lint run at the same point CI stops. Run `gofmt -w .` to fix.
    cmds:
      - |
        unformatted="$(gofmt -l .)"
        if [ -n "$unformatted" ]; then
          echo "These files are not gofmt-clean:"
          echo "$unformatted"
          echo "Run 'gofmt -w .' to fix."
          exit 1
        fi
        echo "All files are gofmt-clean"

  vet:
    desc: Run go vet for static analysis
    cmds:
      - go vet ./...

  fix:check:
    desc: Fail if any go fix modernizer still applies
    summary: |
      Runs the Go fix tool in diff mode, which exits non-zero and prints a patch
      when a modernizer (interface{} to any, three-clause loops to for-range over
      an integer, strings.Cut, and so on) still applies. Run `go fix ./...` to
      apply the patch, then review it: the fixers occasionally leave a redundant
      assignment behind.
    cmds:
      - go fix -diff ./...

  test:
    desc: Run all tests
    cmds:
      - go test -v ./...
    env:
      CGO_ENABLED: 1

  test:headless:
    desc: Run tests with a virtual display (for Ebiten/CI)
    cmds:
      - xvfb-run -a go test -v ./...

  test:nodisplay:
    desc: Check the graphics-free packages build and test with no display at all
    summary: |
      Runs scripts/check-headless-packages.sh, which fails if a package outside
      the presentation stack pulls Ebitengine into its dependency graph, then
      builds and runs those packages' tests with DISPLAY unset and no xvfb.

      This is what a headless consumer does: a server-side simulation or a CI
      job that links the simulation stack and never opens a window.
    cmds:
      - ./scripts/check-headless-packages.sh

  lint:
    desc: Run linters and helper checks
    summary: |
      Mirrors the Code Analysis workflow, in the order that workflow runs its
      gates, and adds the local-only checks below it. A clean run here should
      predict a green Code Analysis check. Requires staticcheck and
      golangci-lint on PATH; run `task install:tools` first on a fresh
      checkout, or this fails rather than skipping them.
    cmds:
      - task: fmt:check
      - task: vet
      - task: fix:check
      - |
        if command -v staticcheck >/dev/null 2>&1; then
          staticcheck ./...
        else
          echo "staticcheck not installed; run 'task install:tools'" >&2
          exit 1
        fi
      - |
        # staticcheck runs standalone above, as it does in CI. golangci-lint
        # bundles it too but also enables the QF quickfix family, so leaving
        # both on reports the same tool twice with different opinions.
        if command -v golangci-lint >/dev/null 2>&1; then
          golangci-lint run --timeout=5m --disable=staticcheck
        else
          echo "golangci-lint not installed; run 'task install:tools'" >&2
          exit 1
        fi
      - ./scripts/check-multiple-blank-lines.sh
      - xvfb-run -a go test -race -short ./...
      - task: test:nodisplay

  setup:
    desc: Download dependencies for a fresh checkout
    cmds:
      - task: deps

  install:tools:
    desc: Install development tools
    summary: |
      Installs golangci-lint from the /v2 module path. The unsuffixed
      github.com/golangci/golangci-lint module stops resolving at v1.64.8
      under semantic import versioning; CI runs v2 (golangci-lint-action@v7
      in the shared go-analysis workflow), and v1 vs v2 enable different
      default linters. Installing from the unsuffixed path would drift this
      task's verdict from Code Analysis's.
    cmds:
      - go install honnef.co/go/tools/cmd/staticcheck@latest
      - go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@latest
